[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
; Suppress Bluedroid's unsolicited sniff/unsniff requests (bta_dm_pm)
; by disabling the local power-mode change API BTM_SetPowerMode.
; Sniff requests from the Switch originate remotely and are unaffected.
; Bluedroid does not handle CSB receive events (0x51), so intercept
; the HCI event entry point and process those events ourselves.
build_flags = -Wl,--wrap=BTM_SetPowerMode -Wl,--wrap=BTM_SetDeviceClass -Wl,--wrap=btu_hcif_process_event -Wl,--wrap=btsnd_hcic_create_conn

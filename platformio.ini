[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
; bluedroidが自発的に出すsniff/unsniff要求(bta_dm_pm)を止めるため、
; ローカル発の電源モード変更API BTM_SetPowerMode を無効化する。
; Switch側が要求するsniffはリモート発なので影響を受けない。
; CSB受信のイベント(0x51)はbluedroidが扱わないため、HCIイベントの入口を
; 横取りして自前で読む。
build_flags = -Wl,--wrap=BTM_SetPowerMode -Wl,--wrap=BTM_SetDeviceClass -Wl,--wrap=btu_hcif_process_event -Wl,--wrap=btsnd_hcic_create_conn
